<!doctype html><html><head><meta charset="utf-8">

<style>@font-face{font-family:'NotoJP';font-weight:500;src:url('noto500.woff2') format('woff2')}
@font-face{font-family:'NotoJP';font-weight:700;src:url('noto700.woff2') format('woff2')}
@font-face{font-family:'NotoJP';font-weight:900;src:url('noto900.woff2') format('woff2')}

*{margin:0;padding:0;box-sizing:border-box}
body{width:1040px;height:1040px;background:#fff;font-family:'NotoJP',sans-serif;color:#1A1A1A;position:relative;overflow:hidden}
.wrap{padding:60px 76px 0}
.pill{display:inline-block;background:#2563EB;color:#fff;font-weight:700;font-size:30px;padding:10px 26px;border-radius:999px;letter-spacing:.04em}
.kicker{margin-top:34px;font-weight:700;font-size:34px;color:#2563EB;letter-spacing:.02em}
h1{margin-top:6px;font-weight:900;font-size:112px;line-height:1.05;letter-spacing:-.01em}
h2{margin-top:20px;font-weight:900;font-size:62px;line-height:1.25}
.walls{display:flex;gap:22px;margin-top:40px}
.w{flex:1;border:4px solid #2563EB;border-radius:20px;padding:24px 0 22px;text-align:center}
.w .n{font-weight:900;font-size:40px;color:#2563EB}
.w .t{font-weight:900;font-size:50px;margin-top:2px}
.w .s{font-weight:700;font-size:26px;color:#555;margin-top:4px}
.band{position:absolute;left:0;right:0;bottom:0;height:210px;background:#2563EB;color:#fff;display:flex;flex-direction:column;justify-content:center;padding:0 76px}
.band .a{font-weight:900;font-size:38px;line-height:1.45}
.band .b{font-weight:500;font-size:26px;margin-top:10px;opacity:.92}
</style></head><body>
<div class="wrap">
  <span class="pill">LINEを追加してくださった方へ</span>
  <div class="kicker">Claude Code × クライアントワーク</div>
  <h1>3分チェック</h1>
  <h2>あなたはいま、<br>どの壁の前にいる？</h2>
  <div class="walls">
    <div class="w"><div class="n">①</div><div class="t">案件選び</div><div class="s">の壁</div></div>
    <div class="w"><div class="n">②</div><div class="t">納品</div><div class="s">の壁</div></div>
    <div class="w"><div class="n">③</div><div class="t">単価</div><div class="s">の壁</div></div>
  </div>
</div>
<div class="band"><div class="a">チェックを入れるだけ・3分で分かります<br>気になったら「相談」と送ってください</div><div class="b">いけ｜ClaudeCode×高単価クライアントワーク</div></div>
</body></html>
