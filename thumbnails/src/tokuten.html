<!doctype html><html><head><meta charset="utf-8">

<style>@font-face{font-family:'NotoJP';font-weight:500;src:url('noto500.woff2') format('woff2')}
@font-face{font-family:'NotoJP';font-weight:700;src:url('noto700.woff2') format('woff2')}
@font-face{font-family:'NotoJP';font-weight:900;src:url('noto900.woff2') format('woff2')}

*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:670px;background:#fff;font-family:'NotoJP',sans-serif;color:#1A1A1A;position:relative;overflow:hidden}
.wrap{padding:58px 72px 0}
.pill{display:inline-block;background:#2563EB;color:#fff;font-weight:700;font-size:26px;padding:8px 22px;border-radius:999px}
.kicker{margin-top:26px;font-weight:700;font-size:34px;color:#2563EB}
h1{margin-top:4px;font-weight:900;font-size:80px;line-height:1.18;letter-spacing:-.01em}
.sub{margin-top:14px;font-weight:700;font-size:32px;color:#444}
.steps{display:flex;align-items:center;gap:8px;margin-top:56px}
.st{text-align:center;line-height:1.25;border:3px solid #2563EB;border-radius:14px;padding:14px 14px;font-weight:900;font-size:24px;white-space:nowrap}
.st.last{background:#2563EB;color:#fff}
.ar{color:#2563EB;font-weight:900;font-size:24px}
.foot{position:absolute;left:72px;bottom:34px;font-weight:500;font-size:24px;color:#666}
</style></head><body>
<div class="wrap">
  <span class="pill">個別相談に参加された方への特典</span>
  <div class="kicker">Claude Code ×</div>
  <h1>高単価クライアントワーク攻略</h1>
  <div class="sub">最初の1件から、月額の契約になるまでの順番</div>
  <div class="steps">
    <div class="st">準備</div><div class="ar">→</div>
    <div class="st">入口の1件を選ぶ</div><div class="ar">→</div>
    <div class="st">納品で広げる</div><div class="ar">→</div>
    <div class="st">Claude Codeで<br>作業を減らす</div><div class="ar">→</div>
    <div class="st last">実績にして次へ</div>
  </div>
</div>
<div class="foot">いけ｜ClaudeCode×高単価クライアントワーク</div>
</body></html>
